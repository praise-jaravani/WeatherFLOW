# CLCRN — Conditional Local Convolution Recurrent Network
# Baseline model. Hyperparameters from Gaibie et al. (2024) where available.
# Note: Gaibie et al. optimized CLCRN with input windows in {48, 72, 168}h.
# We use T=12 for benchmark uniformity with AGCRN across all models.

model:
  name: clcrn
  hidden_dim: 64          # within Gaibie et al. (2024) CLCRN search range [32, 64, 128]
  num_layers: 2
  embed_dim: 16           # node embedding dimension
  k_neighbors: 25         # k-NN graph size for spherical geometry (CLCRN default)
  lck_structure: [4, 8]   # CLConv kernel layer sizes
  max_view: 2             # max spatial hops in CLConv

training:
  learning_rate: 0.001    # within Gaibie et al. (2024) CLCRN search range (0.0003, 0.003)
  batch_size: 32          # within Gaibie et al. (2024) CLCRN search range [32, 64, 125]
  epochs: 100
  early_stopping_patience: 15
  gradient_clip_max_norm: 5.0
  scheduler:
    type: CosineAnnealingWarmRestarts
    T_0: 10
    T_mult: 2
    eta_min: 1.0e-6

data:
  input_len: 12           # T=12 for benchmark uniformity; Gaibie et al. (2024) used T∈{48,72,168}h for CLCRN
  horizon: 12             # H: within Gaibie et al. (2024) tested horizons (3/6/9/12/24h)

evaluation:
  vpt_epsilon: 0.3        # NRMSE threshold for VPT (Platt et al. ~0.3; fraction of a std)
