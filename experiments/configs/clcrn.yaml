# CLCRN — Conditional Local Convolution Recurrent Network
# Baseline model. Values for the HPO-optimised campaign:
#   Lin et al. (2022) — original CLCRN paper (architecture defaults)
#   Our Optuna TPE HPO v2 on N=32 SAWS (2026-08-31 / 2026-09-01)
#
# 2026-09-01 HPO-campaign update:
#   lr 0.01 → 6e-3 (HPO v2 FINAL winner, 35/30 trials; trials 17+19 tied
#             val_loss=0.3456; search space {1e-4,3e-4,1e-3,3e-3,6e-3,1e-2})
#   embed_dim 16 → 8 (HPO v2 FINAL winner)
#   input_len 12 → 24 (HPO v2 FINAL winner; all top-3 configs use 24)
#   epochs 40 → 100 (Lin et al. §5.1 paper protocol; early stopping handles exit)
#   scheduler CosineAnnealingWarmRestarts → multistep (paper faithful:
#             Lin et al. 2022 App D1 + vendored config_clcrn.yaml:
#             MultiStepLR milestones=[10,20,30] gamma=0.05)

model:
  name: clcrn
  hidden_dim: 32          # HPO v2 winner (= Gaibie 2024 RNN units = 32)
  num_layers: 2           # HPO v2 winner
  embed_dim: 8            # HPO v2 winner (search space {8, 16, 32})
  k_neighbors: 25         # HPO v2 winner (= Lin et al. 2022 default)
  lck_structure: [4, 8]   # Lin et al. (2022) CLConv kernel layer sizes
  max_view: 2             # Lin et al. (2022) max spatial hops in CLConv

training:
  # HPO v2 FINAL winner: lr=6e-3, from Optuna TPE 35-trial study (hpo_clcrn_v2).
  # Best val_loss=0.3456 (trials 17 and 19 tied, identical config).
  # NOTE: HPO v2 ran under CosineAnnealingWarmRestarts. These values transfer
  # to MultiStepLR because the MedianPruner fires mainly in epochs 0-10
  # (before the first CAWR restart and the first MultiStepLR step), so the
  # two schedules are equivalent over the trial-evaluation window.
  learning_rate: 6.0e-3   # HPO v2 winner (35 trials, val_loss=0.3456)
  batch_size: 32          # HPO v2 winner (= Lin et al. 2022 / Gaibie 2024)
  epochs: 100             # Lin et al. (2022) §5.1: max 100 epochs; early stopping handles exit
  early_stopping_patience: 15    # our harness addition; disclosed as uniform
  gradient_clip_max_norm: 5.0
  scheduler:
    # Lin et al. (2022) Appendix D1: "basic learning rate is 0.01, decays
    # with the ratio 0.05 per 10 epoch in the first 50 epoch."
    # Vendored experiments/config_clcrn.yaml (ground truth): MultiStepLR
    # milestones=[10, 20, 30] gamma=0.05 (3 decay steps, not 5 — the paper
    # text overstates the range; the code config is authoritative).
    type: multistep
    milestones: [10, 20, 30]
    gamma: 0.05

data:
  # Horizon extended to 48 (2026-08-04): retrained-max target per Moodley's
  # 24h+ demand. Evaluate at h ∈ {3, 6, 9, 12, 24, 36, 48} by truncation.
  # HPO v2 winner: input_len=24 (all top-3 configs; search space {12, 24}).
  input_len: 24
  horizon: 48             # H=48; retrained-max target
  # Gaibie (2024) univariate regime. Default HPO target = t2m. Production
  # runs iterate over {t2m, sp, rh, ws} via CLI overrides.
  target_variable: t2m
  # Phase 2 (classification) — ignored for regression runs
  label_mode: per_variable          # 'per_variable' (§2.1) or 'any' (legacy)
  label_variables: [t2m, tp, rh, ws]  # SAWS var registry per Gaibie targets (2026-08-04 fix; was ERA5 names)
  decision_threshold: val_f1        # τ per (model, variable) selected on val by max-F1 (§4.3)
  threshold_scheme: calendar_hour_relative   # CH labels (docs/PHASE2_FORMULATION.md §2.1) — MUST be set
                                              # or load_cache defaults to `static` (Gaibie 2024 baseline).
                                              # Fix landed 2026-08-18 after the campaign trained on static.

evaluation:
  vpt_epsilon: 0.3        # NRMSE threshold for VPT (Pathak et al. 2018 ~0.3; fraction of a std)
