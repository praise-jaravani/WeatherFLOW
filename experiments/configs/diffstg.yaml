# DiffSTG — Diffusion-based Spatio-Temporal Graph Model
# Diffusion model (Génevieve's workstream).
# forward() uses n_train_steps denoising steps (fast, approximate training loss).
# predict() uses n_infer_steps denoising steps (full quality inference).

model:
  name: diffstg
  hidden_dim: 64
  num_heads: 4            # attention heads in the denoising network

training:
  learning_rate: 2.0e-4
  batch_size: 16          # diffusion models are memory-intensive
  epochs: 100
  early_stopping_patience: 15
  gradient_clip_max_norm: 1.0
  scheduler:
    type: CosineAnnealingWarmRestarts
    T_0: 10
    T_mult: 2
    eta_min: 1.0e-6

diffusion:
  schedule: linear        # 'linear' or 'cosine'
  beta_start: 1.0e-4
  beta_end: 0.02
  n_train_steps: 10       # shortened chain used in forward() during training
  n_infer_steps: 100      # full chain used in predict() at evaluation

data:
  input_len: 12           # T — TODO: confirm (Open Question #1)
  horizon: 12             # H — TODO: confirm (Open Question #1)

evaluation:
  vpt_epsilon: 0.5        # TODO: confirm from Gaibie et al. (2024)
