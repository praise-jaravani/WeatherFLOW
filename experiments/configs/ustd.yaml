# USTD — Uncertainty-aware Spatio-Temporal Diffusion
# Diffusion model (Génevieve's workstream).
# Extends DiffSTG with explicit uncertainty quantification.
# Same forward/predict denoising chain distinction as DiffSTG.

model:
  name: ustd
  hidden_dim: 64
  num_heads: 4

training:
  learning_rate: 2.0e-4
  batch_size: 16
  epochs: 100
  early_stopping_patience: 15
  gradient_clip_max_norm: 1.0
  scheduler:
    type: CosineAnnealingWarmRestarts
    T_0: 10
    T_mult: 2
    eta_min: 1.0e-6

diffusion:
  schedule: cosine        # USTD uses cosine schedule (Nichol & Dhariwal 2021)
  n_train_steps: 10
  n_infer_steps: 100

data:
  input_len: 12           # T — TODO: confirm (Open Question #1)
  horizon: 12             # H — TODO: confirm (Open Question #1)

evaluation:
  vpt_epsilon: 0.5        # TODO: confirm from Gaibie et al. (2024)
