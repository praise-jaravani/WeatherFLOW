# USTD — Uncertainty-aware Spatio-Temporal Diffusion
# Diffusion model (Génevieve's workstream).
# Extends DiffSTG with explicit uncertainty quantification.
# Same forward/predict denoising chain distinction as DiffSTG.

model:
  name: ustd
  hidden_dim: 64
  num_heads: 4

training:
  learning_rate: 2.0e-4
  batch_size: 16
  epochs: 100
  early_stopping_patience: 15
  gradient_clip_max_norm: 1.0
  scheduler:
    type: CosineAnnealingWarmRestarts
    T_0: 10
    T_mult: 2
    eta_min: 1.0e-6

diffusion:
  schedule: cosine        # USTD uses cosine schedule (Nichol & Dhariwal 2021)
  n_train_steps: 10
  n_infer_steps: 100

data:
  input_len: 12           # T=12 matches Gaibie et al. (2024) HPO optimal for AGCRN; kept uniform across all models
  horizon: 12             # H: within Gaibie et al. (2024) tested horizons (3/6/9/12/24h)

evaluation:
  vpt_epsilon: 0.3        # NRMSE threshold for VPT (Platt et al. ~0.3; fraction of a std)
