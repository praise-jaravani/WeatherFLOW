# MTGODE — Multi-scale Temporal Graph ODE
# Continuous-time model (Praise's workstream).
# ODE solver settings: loose tolerances during training, tight at evaluation.
# See mtgode_adapter.py and modules/ode_integrator.py.

model:
  name: mtgode
  hidden_dim: 40
  num_layers: 2
  dropout: 0.3
  # Adaptive graph construction (from original MTGODE repo)
  graph_constructor:
    k: 10                 # top-k neighbours in learned graph
    alpha: 3              # saturation rate of tanh

training:
  learning_rate: 0.001
  batch_size: 32
  epochs: 100
  early_stopping_patience: 15
  gradient_clip_max_norm: 5.0
  scheduler:
    type: CosineAnnealingWarmRestarts
    T_0: 10
    T_mult: 2
    eta_min: 1.0e-6

ode:
  # MTGODE's ODEBlock only accepts 'euler' or 'rk4' (raises ValueError for others)
  method_1: euler         # outer temporal ODE — fixed-step solvers only
  method_2: euler         # inner graph ODE (inside CGP layers)
  adjoint: true           # adjoint method for memory-efficient backprop
  time_1: 1.2
  step_size_1: 0.4
  time_2: 1.0
  step_size_2: 0.25
  rtol: 1.0e-4
  atol: 1.0e-3

data:
  input_len: 12           # T=12 matches Gaibie et al. (2024) HPO optimal for AGCRN; kept uniform across all models
  horizon: 12             # H: within Gaibie et al. (2024) tested horizons (3/6/9/12/24h)

evaluation:
  vpt_epsilon: 0.3        # NRMSE threshold for VPT (Platt et al. ~0.3; fraction of a std)
