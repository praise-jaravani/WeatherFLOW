# STLGRU — Spatio-Temporal Lightweight GRU
# Lightweight model (Zoleka's workstream).
# Designed for parameter efficiency — expect low param count and fast inference.

model:
  name: stlgru
  hidden_dim: 32          # smaller than baselines by design
  num_layers: 1
  dropout: 0.1

training:
  learning_rate: 0.001
  batch_size: 64          # larger batch leverages the lightweight architecture
  epochs: 100
  early_stopping_patience: 15
  gradient_clip_max_norm: 5.0
  scheduler:
    type: CosineAnnealingWarmRestarts
    T_0: 10
    T_mult: 2
    eta_min: 1.0e-6

data:
  input_len: 12           # T=12 matches Gaibie et al. (2024) HPO optimal for AGCRN; kept uniform across all models
  horizon: 12             # H: within Gaibie et al. (2024) tested horizons (3/6/9/12/24h)

evaluation:
  vpt_epsilon: 0.3        # NRMSE threshold for VPT (Platt et al. ~0.3; fraction of a std)
