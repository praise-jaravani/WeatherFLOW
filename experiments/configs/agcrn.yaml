# AGCRN — Adaptive Graph Convolutional Recurrent Network
# Baseline model. Hyperparameters from Gaibie et al. (2024) Table 1 (HPO optimal values).

model:
  name: agcrn
  hidden_dim: 64          # Gaibie et al. (2024): RNN units = 64
  num_layers: 2           # Gaibie et al. (2024): num layers = 2
  embed_dim: 10            # node embedding dimension for adaptive graph
  cheb_k: 2               # Chebyshev polynomial order

training:
  learning_rate: 0.01     # Gaibie et al. (2024): optimal lr = 0.01
  batch_size: 64          # Gaibie et al. (2024): optimal batch size = 64
  epochs: 100
  early_stopping_patience: 15
  gradient_clip_max_norm: 5.0
  scheduler:
    type: CosineAnnealingWarmRestarts
    T_0: 10
    T_mult: 2
    eta_min: 1.0e-6

data:
  input_len: 12           # T: Gaibie et al. (2024) HPO optimal for AGCRN = 12h
  horizon: 12             # H: within Gaibie et al. (2024) tested horizons (3/6/9/12/24h)

evaluation:
  vpt_epsilon: 0.3        # NRMSE threshold for VPT (Platt et al. ~0.3; fraction of a std)
