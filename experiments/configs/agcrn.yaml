# AGCRN — Adaptive Graph Convolutional Recurrent Network
# Baseline model. Hyperparameters follow Gaibie et al. (2024) unless noted.
# TODO: confirm learning_rate, hidden_dim, num_layers with team once Gaibie et al. values are locked.

model:
  name: agcrn
  hidden_dim: 64          # TODO: confirm from Gaibie et al. (2024)
  num_layers: 2
  embed_dim: 10            # node embedding dimension for adaptive graph
  cheb_k: 2               # Chebyshev polynomial order

training:
  learning_rate: 0.001    # TODO: confirm from Gaibie et al. (2024)
  batch_size: 32
  epochs: 100
  early_stopping_patience: 15
  gradient_clip_max_norm: 5.0
  scheduler:
    type: CosineAnnealingWarmRestarts
    T_0: 10
    T_mult: 2
    eta_min: 1.0e-6

data:
  input_len: 12           # T: historical window — TODO: confirm with team (Open Question #1)
  horizon: 12             # H: forecast horizon  — TODO: confirm with team (Open Question #1)

evaluation:
  vpt_epsilon: 0.5        # NRMSE threshold for VPT — TODO: confirm from Gaibie et al. (2024)
