# ClimODE-inspired — advection-motivated graph ODE (Praise's workstream).
#
# ⚠️ NOT the Verma et al. (ICLR 2024) ClimODE architecture. This is a
# hand-written physics-motivated graph ODE that borrows the core advection
# idea from Verma et al. but skips their flow-velocity network, Gaussian
# emission network, and second-order continuity equation. ~17K params vs
# their several million. Referenced everywhere in results docs as
# "ClimODE-inspired". CLI/model class names kept as `climode` for
# backwards-compat with the results archive; label is the honest one.
# See models/continuous_time/climode_model.py header for full context.
#
# ODE solver settings: same loose/tight pattern as MTGODE.

model:
  name: climode
  hidden_dim: 64
  # Velocity field parameterisation (from Optim_velocity in cloned repo)
  velocity_channels: 5    # number of velocity channels (v_x, v_y)

training:
  learning_rate: 5.0e-4
  batch_size: 16          # smaller batch — ClimODE is memory-intensive
  epochs: 30                 # capped: ~38 min/epoch on L40S × 999 nodes; 30 lands at a cosine-restart trough
  early_stopping_patience: 15
  gradient_clip_max_norm: 1.0
  scheduler:
    type: CosineAnnealingWarmRestarts
    T_0: 10
    T_mult: 2
    eta_min: 1.0e-6

ode:
  method: dopri5
  adjoint: true
  train_rtol: 1.0e-3
  train_atol: 1.0e-4
  eval_rtol: 1.0e-5
  eval_atol: 1.0e-6

data:
  input_len: 12           # T=12 matches Gaibie et al. (2024) HPO optimal for AGCRN; kept uniform across all models
  horizon: 12             # H: within Gaibie et al. (2024) tested horizons (3/6/9/12/24h)
  # Phase 2 (classification) — ignored for regression runs
  label_mode: per_variable          # 'per_variable' (§2.1) or 'any' (legacy)
  label_variables: [t2m, d2m, tp, ws10, rh, sp]   # §2.4 default; u10/v10 excluded
  decision_threshold: val_f1        # τ per (model, variable) selected on val by max-F1 (§4.3)

evaluation:
  vpt_epsilon: 0.3        # NRMSE threshold for VPT (Platt et al. ~0.3; fraction of a std)
