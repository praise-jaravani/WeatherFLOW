# ClimODE — Climate and Weather Forecasting with Physics-informed Neural ODEs
# Continuous-time model (Praise's workstream).
# Originally designed for gridded ERA5 data; adapted to station graphs here.
# ODE solver settings: same loose/tight pattern as MTGODE.

model:
  name: climode
  hidden_dim: 64
  # Velocity field parameterisation (from Optim_velocity in cloned repo)
  velocity_channels: 5    # number of velocity channels (v_x, v_y)

training:
  learning_rate: 5.0e-4
  batch_size: 16          # smaller batch — ClimODE is memory-intensive
  epochs: 100
  early_stopping_patience: 15
  gradient_clip_max_norm: 1.0
  scheduler:
    type: CosineAnnealingWarmRestarts
    T_0: 10
    T_mult: 2
    eta_min: 1.0e-6

ode:
  method: dopri5
  adjoint: true
  train_rtol: 1.0e-3
  train_atol: 1.0e-4
  eval_rtol: 1.0e-5
  eval_atol: 1.0e-6

data:
  input_len: 12           # T — TODO: confirm (Open Question #1)
  horizon: 12             # H — TODO: confirm (Open Question #1)

evaluation:
  vpt_epsilon: 0.5        # TODO: confirm from Gaibie et al. (2024)
