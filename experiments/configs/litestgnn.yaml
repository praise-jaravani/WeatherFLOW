# Lite-STGNN — Lightweight Spatio-Temporal Graph Neural Network
# Lightweight model (Zoleka's workstream).
# Prioritises inference speed alongside parameter efficiency.

model:
  name: litestgnn
  hidden_dim: 32
  num_layers: 2
  dropout: 0.1

training:
  learning_rate: 0.001
  batch_size: 64
  epochs: 100
  early_stopping_patience: 15
  gradient_clip_max_norm: 5.0
  scheduler:
    type: CosineAnnealingWarmRestarts
    T_0: 10
    T_mult: 2
    eta_min: 1.0e-6

data:
  input_len: 12           # T — TODO: confirm (Open Question #1)
  horizon: 12             # H — TODO: confirm (Open Question #1)

evaluation:
  vpt_epsilon: 0.5        # TODO: confirm from Gaibie et al. (2024)
